<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dogen.builder.xyz</title>
  <meta name="description" content="Austin Fay — professional work in oil and gas, and The Workshop, a personal digital garden.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="landing.css">
  <script>
    // Decide before first paint whether the intro plays, so the doors never flash first.
    // Once per session, never with reduced motion, and never without JS.
    try {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('intro-seen')) {
        document.documentElement.classList.add('intro-open');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="intro" id="intro">
    <video class="intro__video" muted playsinline preload="none" aria-hidden="true"></video>
    <button class="intro__skip" type="button">Skip intro <span aria-hidden="true">↓</span></button>
  </div>

  <main>
    <span class="chrome chrome--tl" aria-hidden="true">builder.xyz</span>
    <span class="chrome chrome--tc" aria-hidden="true">Index / 2026</span>
    <span class="chrome chrome--tr" aria-hidden="true">30.31°N&nbsp; 104.02°W</span>
    <span class="chrome chrome--bl" aria-hidden="true">Dogen — Austin Fay</span>
    <span class="mark mark--tl" aria-hidden="true"></span>
    <span class="mark mark--tr" aria-hidden="true"></span>
    <span class="mark mark--bl" aria-hidden="true"></span>
    <span class="mark mark--br" aria-hidden="true"></span>
    <button class="replay" type="button" hidden>▶ Replay intro</button>

    <div class="container">
      <header class="head">
        <h1 class="site-title">dogen<span class="dot">.</span>builder<span class="dot">.</span>xyz</h1>
        <p class="tagline">Select a door <span aria-hidden="true">→</span></p>
      </header>

      <div class="split">
        <a href="pro/" class="panel panel--pro">
          <span class="panel__label">Professional</span>
          <canvas class="panel__shape" data-shape="sphere" aria-hidden="true"></canvas>
          <span class="panel__title">Austin Fay</span>
          <span class="panel__desc">Division Order Analyst<br>Oil &amp; Gas · Financial Markets</span>
          <span class="panel__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12h14.5M13 6.5 18.5 12 13 17.5"/></svg></span>
        </a>

        <a href="garden.html" class="panel panel--personal">
          <span class="panel__label">Personal</span>
          <canvas class="panel__shape" data-shape="torus" aria-hidden="true"></canvas>
          <span class="panel__title">The Workshop</span>
          <span class="panel__desc">Reading · Tinkering<br>Mezcal · Two-strokes</span>
          <span class="panel__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12h14.5M13 6.5 18.5 12 13 17.5"/></svg></span>
        </a>
      </div>
    </div>
  </main>

  <script>
    // Progressive enhancement: the panel glow follows the pointer.
    // Without JS the glow still renders from its default corner on hover.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      for (const panel of document.querySelectorAll('.panel')) {
        panel.addEventListener('pointermove', (e) => {
          const r = panel.getBoundingClientRect();
          panel.style.setProperty('--mx', `${((e.clientX - r.left) / r.width) * 100}%`);
          panel.style.setProperty('--my', `${((e.clientY - r.top) / r.height) * 100}%`);
        });
        panel.addEventListener('pointerleave', () => {
          panel.style.removeProperty('--mx');
          panel.style.removeProperty('--my');
        });
      }
    }

    // The splash's point clouds, drawn live at the screen's pixel density so they stay sharp.
    // One still frame with reduced motion; no drawing while the intro covers the page.
    (() => {
      const canvases = [...document.querySelectorAll('.panel__shape')];
      const TAU = Math.PI * 2;
      const sphere = [];
      for (let i = 0; i < 260; i++) {
        const y = 1 - (i / 259) * 2;
        const r = Math.sqrt(1 - y * y);
        sphere.push([Math.cos(i * 2.399963) * r, y, Math.sin(i * 2.399963) * r]);
      }
      const torus = [];
      for (let i = 0; i < 44; i++) {
        for (let j = 0; j < 14; j++) {
          const u = (i / 44) * TAU;
          const v = (j / 14) * TAU;
          const ring = 0.72 + 0.28 * Math.cos(v);
          torus.push([ring * Math.cos(u), 0.28 * Math.sin(v), ring * Math.sin(u)]);
        }
      }

      function draw(t) {
        const ay = t * 0.9;
        const ax = 0.5 + 0.2 * Math.sin(t * 0.6);
        const [sinY, cosY, sinX, cosX] = [Math.sin(ay), Math.cos(ay), Math.sin(ax), Math.cos(ax)];
        for (const c of canvases) {
          const size = c.clientWidth;
          if (!size) continue;
          const dpr = window.devicePixelRatio || 1;
          if (c.width !== Math.round(size * dpr)) c.width = c.height = Math.round(size * dpr);
          const g = c.getContext('2d');
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.clearRect(0, 0, size, size);
          g.fillStyle = getComputedStyle(c).color;
          const R = size * 0.4;
          const unit = size / 300;
          for (const [px, py, pz] of c.dataset.shape === 'torus' ? torus : sphere) {
            const x1 = px * cosY + pz * sinY;
            const z1 = -px * sinY + pz * cosY;
            const depth = (py * sinX + z1 * cosX + 1) / 2;
            g.globalAlpha = 0.18 + 0.82 * depth;
            g.beginPath();
            g.arc(size / 2 + x1 * R, size / 2 + (py * cosX - z1 * sinX) * R, (1.3 + depth * 2.6) * unit, 0, TAU);
            g.fill();
          }
        }
      }

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        draw(1.2);
        addEventListener('resize', () => draw(1.2));
      } else {
        const loop = (now) => {
          if (!document.documentElement.classList.contains('intro-open')) draw(now / 1000);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    })();

    // Full-screen intro: the hypermodern cut, which ends on the same near-black as this
    // page and dissolves into it. Any failure (autoplay blocked, load error, a stall)
    // reveals the doors straight away, so the intro can never hold them hostage.
    (() => {
      const root = document.documentElement;
      const intro = document.getElementById('intro');
      const video = intro.querySelector('video');
      const main = document.querySelector('main');
      const replay = document.querySelector('.replay');
      const INK_AT = 10.3; // the video's ink ripple starts here; the letterbox follows it
      let open = false;
      let stall;
      let returnTo = null;

      // 4K only where 1080p would be visibly stretched (big or high-density screens), and only
      // when the device says it decodes 4K smoothly and the connection isn't slow or saving data.
      async function rendition() {
        const cover = matchMedia('(min-aspect-ratio: 8/5) and (max-aspect-ratio: 2/1)').matches;
        const fill = cover ? Math.max(innerWidth, innerHeight * 16 / 9) : Math.min(innerWidth, innerHeight * 16 / 9);
        const net = navigator.connection || {};
        if (fill * (window.devicePixelRatio || 1) < 2200 || net.saveData || (net.downlink && net.downlink < 8)) {
          return 'hypermodern-intro.mp4';
        }
        const type = 'video/mp4; codecs="avc1.640034"';
        let smooth = video.canPlayType(type) !== '';
        try {
          const info = await navigator.mediaCapabilities.decodingInfo({
            type: 'file',
            video: { contentType: type, width: 3840, height: 2160, bitrate: 8e6, framerate: 60 },
          });
          smooth = info.supported && info.smooth;
        } catch (e) {}
        return smooth ? 'hypermodern-intro-2160.mp4' : 'hypermodern-intro.mp4';
      }

      async function play(from) {
        open = true;
        returnTo = from || null;
        root.classList.add('intro-open');
        intro.classList.remove('is-leaving', 'is-ink');
        main.inert = true;
        try { sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
        stall = setTimeout(finish, 3000);
        if (!video.getAttribute('src')) {
          video.poster = 'media/hypermodern-intro.jpg';
          video.src = 'media/' + (await rendition());
          if (!open) return; // skipped while choosing
        }
        video.currentTime = 0;
        video.play().catch(finish);
      }

      function finish() {
        if (!open) return;
        open = false;
        clearTimeout(stall);
        video.pause();
        // inert dropped focus when the intro opened; put the keyboard back somewhere sensible
        const hadFocus = intro.contains(document.activeElement);
        intro.classList.add('is-leaving');
        root.classList.remove('intro-open'); // releases the doors' entrance animation
        main.inert = false;
        if (returnTo) returnTo.focus();
        else if (hadFocus) main.querySelector('.panel').focus();
        setTimeout(() => intro.classList.remove('is-leaving', 'is-ink'), 650);
      }

      // Browsers won't play muted video in a background tab, so an intro opened in one
      // waits until it's actually seen, and one interrupted by a tab switch picks back up.
      function start() {
        if (document.hidden) document.addEventListener('visibilitychange', start, { once: true });
        else play();
      }
      document.addEventListener('visibilitychange', () => {
        if (open && !document.hidden && video.paused) video.play().catch(finish);
      });

      video.addEventListener('playing', () => clearTimeout(stall));
      video.addEventListener('timeupdate', () => {
        if (video.currentTime >= INK_AT) intro.classList.add('is-ink');
      });
      video.addEventListener('ended', finish);
      video.addEventListener('error', finish);
      intro.querySelector('.intro__skip').addEventListener('click', finish);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') finish();
      });
      replay.addEventListener('click', () => play(replay));
      replay.hidden = false;

      if (root.classList.contains('intro-open')) start();
    })();
  </script>
</body>
</html>
