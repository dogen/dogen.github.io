<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>builder.xyz · analog</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,144,900,100,1;1,144,900,100,1&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script src="lib.js"></script>
    <script>
      // A 1970s station break on 16mm. Academy leader counts down, colour bars
      // hold for a beat, then the dial clicks between channel 1 (professional:
      // a pumpjack at sundown) and channel 2 (personal: a two-stroke cutaway).
      // Everything runs through a film pass: weave, flicker, grain, dust.
      const { W, H, lerp, span, within, ease, rand, noise, layer, noiseTile, typed } = M

      const P = {
        cream: "#efe4cc",
        brown: "#3b2416",
        dark: "#1d120b",
        orange: "#d4582a",
        rust: "#b9481f",
        mustard: "#e3a72f",
        avocado: "#6f7d33",
        olive: "#5d6a28",
        teal: "#2e6a64",
      }
      const DISPLAY = "Fraunces, serif"
      const TYPE = '"Courier Prime", monospace'
      const LEADER = '"Archivo Black", sans-serif'
      const TAU = Math.PI * 2

      // Channel dial: [start of the click, channel it lands on]
      const CLICKS = [
        [6.6, 1],
        [9.1, 2],
      ]

      const [buf, b] = layer()
      const [film, f] = layer()
      let grain, fine

      M.scene({
        duration: 12,
        fps: 24,
        crf: 30,
        poster: 7.9,
        fonts: [
          `900 100px ${DISPLAY}`,
          `italic 900 100px ${DISPLAY}`,
          `400 40px ${TYPE}`,
          `700 40px ${TYPE}`,
          `400 100px ${LEADER}`,
        ],
        setup() {
          grain = noiseTile(384, 21)
          fine = noiseTile(256, 22)
        },
        draw(ctx, t, frame) {
          paintAt(b, t, frame)
          // The last half second burns out and dissolves into the first frame.
          const loop = span(t, 11.6, 12)
          if (loop) {
            f.drawImage(buf, 0, 0)
            paintAt(b, 0, 0)
            b.globalAlpha = 1 - loop
            b.drawImage(film, 0, 0)
            b.globalAlpha = 1
          }
          project(ctx, t, frame)
        },
      })

      function paintAt(g, t, frame) {
        g.save()
        paint(g, t, frame)
        g.restore()
      }

      // ---------- composition ----------

      function paint(g, t, frame) {
        g.fillStyle = "#000"
        g.fillRect(0, 0, W, H)
        if (t < 2) return leader(g, t)
        if (t < 2.042) return pop(g)
        if (t < 2.5) return
        if (t < 3.9) return bars(g, t)
        if (t < 4.15) return snow(g, frame)
        if (t < 6.6) return title(g, t)
        if (t < 6.85) return snow(g, frame)
        if (t < 9.1) channelOne(g, t)
        else if (t < 9.35) snow(g, frame)
        else channelTwo(g, t)
        dial(g, t)
        burn(g, t)
      }

      function leader(g, t) {
        const n = 3 - Math.floor(t)
        const k = t % 1
        const cx = W / 2
        const cy = H / 2
        g.fillStyle = "#8f887b"
        g.fillRect(0, 0, W, H)
        g.fillStyle = "#6c665b"
        g.beginPath()
        g.moveTo(cx, cy)
        g.arc(cx, cy, 1400, -Math.PI / 2, -Math.PI / 2 + k * TAU)
        g.fill()

        g.strokeStyle = "#231f1b"
        g.lineWidth = 4
        g.beginPath()
        g.moveTo(0, cy)
        g.lineTo(W, cy)
        g.moveTo(cx, 0)
        g.lineTo(cx, H)
        g.stroke()
        g.lineWidth = 12
        g.strokeStyle = "#f4efe4"
        g.beginPath()
        g.arc(cx, cy, 330, 0, TAU)
        g.stroke()
        g.lineWidth = 6
        g.strokeStyle = "#231f1b"
        g.beginPath()
        g.arc(cx, cy, 392, 0, TAU)
        g.stroke()

        g.fillStyle = "#15120e"
        g.font = `400 470px ${LEADER}`
        g.textAlign = "center"
        g.textBaseline = "middle"
        g.fillText(String(n), cx, cy + 24)
        g.textBaseline = "alphabetic"
      }

      function pop(g) {
        g.strokeStyle = "#fbf6ea"
        g.lineWidth = 26
        g.beginPath()
        g.arc(W / 2, H / 2, 300, 0, TAU)
        g.stroke()
      }

      function bars(g, t) {
        // SMPTE ECR 1-1978, the way it was always slightly off on a real set
        const top = [
          [191, 191, 191],
          [191, 191, 0],
          [0, 191, 191],
          [0, 191, 0],
          [191, 0, 191],
          [191, 0, 0],
          [0, 0, 191],
        ]
        const mid = [
          [0, 0, 191],
          [19, 19, 19],
          [191, 0, 191],
          [19, 19, 19],
          [0, 191, 191],
          [19, 19, 19],
          [191, 191, 191],
        ]
        const bw = W / 7
        top.forEach((c, i) => fill(g, c, i * bw, 0, bw + 1, H * 0.67))
        mid.forEach((c, i) => fill(g, c, i * bw, H * 0.67, bw + 1, H * 0.08))
        const low = [
          [0, 33, 76],
          [255, 255, 255],
          [50, 0, 106],
          [19, 19, 19],
        ]
        low.forEach((c, i) => fill(g, c, i * bw * 1.25, H * 0.75, bw * 1.25 + 1, H * 0.25))
        ;[
          [9, 9, 9],
          [19, 19, 19],
          [29, 29, 29],
        ].forEach((c, i) => fill(g, c, 5 * bw + (i * bw) / 3, H * 0.75, bw / 3 + 1, H * 0.25))
        fill(g, [19, 19, 19], 6 * bw, H * 0.75, bw, H * 0.25)

        // Please Stand By card
        const k = ease.outBack(span(t, 2.75, 3.1))
        if (!k) return
        g.save()
        g.translate(W / 2, H * 0.42)
        g.scale(k, k)
        g.fillStyle = P.brown
        g.beginPath()
        round(g, -470 + 14, -150 + 14, 940, 300, 46)
        g.fill()
        g.fillStyle = P.cream
        g.beginPath()
        round(g, -470, -150, 940, 300, 46)
        g.fill()
        g.lineWidth = 8
        g.strokeStyle = P.brown
        g.stroke()
        g.textAlign = "center"
        g.font = `900 104px ${DISPLAY}`
        retro(g, "Please Stand By", 0, 10, P.brown, [
          [P.mustard, 8],
          [P.orange, 4],
        ])
        g.font = `700 30px ${TYPE}`
        g.letterSpacing = "6px"
        g.fillStyle = P.brown
        g.fillText("TUNING IN · DOGEN.BUILDER.XYZ", 0, 92)
        g.restore()
      }

      function title(g, t) {
        g.fillStyle = P.cream
        g.fillRect(0, 0, W, H)
        g.save()
        const zoom = 1 + 0.025 * span(t, 4.15, 6.6)
        g.translate(W / 2, H / 2)
        g.scale(zoom, zoom)
        g.translate(-W / 2, -H / 2)

        // five stripes sweeping in and turning the corner
        const cx = 1480
        const cy = 560
        const colors = [P.brown, P.orange, P.mustard, P.avocado, P.teal]
        colors.forEach((c, i) => {
          const r = 180 + i * 36
          const len = cx + 60 + (Math.PI / 2) * r + cy + 60
          const k = ease.inOutCubic(span(t, 4.2 + i * 0.07, 5.3 + i * 0.07))
          g.strokeStyle = c
          g.lineWidth = 31
          g.lineCap = "butt"
          g.setLineDash([len * k, len])
          g.beginPath()
          g.moveTo(-60, cy + r)
          g.lineTo(cx, cy + r)
          g.arc(cx, cy, r, Math.PI / 2, 0, true)
          g.lineTo(cx + r, -60)
          g.stroke()
        })
        g.setLineDash([])

        g.textAlign = "left"
        typewriter(
          g,
          "A BROADCAST FROM MARFA, TEXAS",
          150,
          250,
          t,
          4.35,
          26,
          `700 28px ${TYPE}`,
          P.brown,
          8,
        )

        g.font = `900 150px ${DISPLAY}`
        dropIn(g, "dogen.builder.xyz", 140, 440, t, 4.5, P.brown, [
          [P.mustard, 12],
          [P.orange, 6],
        ])

        typewriter(
          g,
          "channel 1: professional · channel 2: personal",
          150,
          560,
          t,
          4.9,
          38,
          `400 36px ${TYPE}`,
          P.brown,
        )
        g.restore()
      }

      function channelOne(g, t) {
        const local = t - 6.85
        g.fillStyle = P.orange
        g.fillRect(0, 0, W, H)
        g.save()
        const zoom = 1 + 0.03 * span(t, 6.85, 9.1)
        g.translate(W / 2, H / 2)
        g.scale(zoom, zoom)
        g.translate(-W / 2, -H / 2)
        sunburst(g, 1300, 1150, P.rust, local * 0.06)

        // striped sun going down behind the rig
        g.fillStyle = P.mustard
        g.beginPath()
        g.arc(1300, 900, 330, Math.PI, TAU)
        g.fill()
        g.fillStyle = P.orange
        for (let i = 0; i < 7; i++) g.fillRect(900, 700 + i * 30, 800, 3 + i * 2.2)

        g.fillStyle = P.brown
        g.fillRect(-50, 896, W + 100, H)
        g.fillStyle = P.mustard
        g.fillRect(-50, 896, W + 100, 5)
        pumpjack(g, 1300, 560, (t * TAU) / 2)

        g.textAlign = "left"
        typewriter(
          g,
          "CHANNEL 1 · PROFESSIONAL",
          150,
          300,
          t,
          6.95,
          30,
          `700 28px ${TYPE}`,
          P.cream,
          8,
        )
        g.font = `900 190px ${DISPLAY}`
        dropIn(g, "Austin Fay", 130, 510, t, 7.05, P.cream, [
          [P.brown, 12],
          [P.mustard, 6],
        ])
        typewriter(g, "Division Order Analyst", 150, 612, t, 7.45, 34, `400 38px ${TYPE}`, P.cream)
        typewriter(
          g,
          "Oil & Gas · Financial Markets",
          150,
          664,
          t,
          7.95,
          34,
          `400 38px ${TYPE}`,
          P.cream,
        )
        g.restore()
      }

      function channelTwo(g, t) {
        g.fillStyle = P.avocado
        g.fillRect(0, 0, W, H)
        g.save()
        const zoom = 1 + 0.03 * span(t, 9.35, 11.6)
        g.translate(W / 2, H / 2)
        g.scale(zoom, zoom)
        g.translate(-W / 2, -H / 2)

        // target rings and engine, drawn at 1330,560 and placed right of the title
        g.save()
        g.translate(1450, 560)
        g.scale(0.82, 0.82)
        g.translate(-1330, -560)
        ;[
          [420, P.olive],
          [360, P.mustard],
          [330, P.avocado],
          [300, P.mustard],
        ].forEach(([r, c]) => {
          g.fillStyle = c
          g.beginPath()
          g.arc(1330, 560, r, 0, TAU)
          g.fill()
        })
        engine(g, 1330, (t * TAU) / 0.9)
        g.restore()

        g.textAlign = "left"
        typewriter(g, "CHANNEL 2 · PERSONAL", 150, 300, t, 9.45, 30, `700 28px ${TYPE}`, P.cream, 8)
        g.font = `900 156px ${DISPLAY}`
        dropIn(g, "The Workshop", 130, 505, t, 9.55, P.cream, [
          [P.brown, 12],
          [P.mustard, 6],
        ])
        typewriter(g, "Reading · Tinkering", 150, 612, t, 9.95, 34, `400 38px ${TYPE}`, P.cream)
        typewriter(g, "Mezcal · Two-strokes", 150, 664, t, 10.4, 34, `400 38px ${TYPE}`, P.cream)
        g.restore()
      }

      // ---------- machines ----------

      /** Beam pumping unit. The beam angle is driven by the crank so the linkage stays honest. */
      function pumpjack(g, px, py, phi) {
        const L1 = 330
        const L2 = 250
        const crank = { x: px - L2, y: 790 }
        const rc = 62
        const theta = Math.asin(-0.248 * Math.sin(phi))
        const cos = Math.cos(theta)
        const sin = Math.sin(theta)
        const front = { x: px + L1 * cos, y: py + L1 * sin }
        const rear = { x: px - L2 * cos, y: py - L2 * sin }
        const pin = { x: crank.x + rc * Math.cos(phi), y: crank.y + rc * Math.sin(phi) }

        g.save()
        g.fillStyle = P.dark
        g.strokeStyle = P.dark
        g.lineCap = "round"
        g.lineJoin = "round"

        g.fillRect(px - 380, 872, 690, 26)

        // samson post
        g.lineWidth = 22
        g.beginPath()
        g.moveTo(px - 120, 880)
        g.lineTo(px, py + 8)
        g.lineTo(px + 100, 880)
        g.moveTo(px - 66, 740)
        g.lineTo(px + 55, 740)
        g.stroke()

        // gearbox, crank and counterweight
        g.beginPath()
        round(g, crank.x - 70, crank.y - 40, 140, 120, 18)
        g.fill()
        g.save()
        g.translate(crank.x, crank.y)
        g.rotate(phi + Math.PI)
        g.beginPath()
        g.moveTo(0, 0)
        g.arc(0, 0, 112, -0.75, 0.75)
        g.closePath()
        g.fill()
        g.fillRect(-10, -16, 90, 32)
        g.restore()
        g.fillStyle = P.mustard
        g.beginPath()
        g.arc(crank.x, crank.y, 12, 0, TAU)
        g.fill()
        g.fillStyle = P.dark

        // pitman arm
        g.lineWidth = 14
        g.beginPath()
        g.moveTo(rear.x, rear.y)
        g.lineTo(pin.x, pin.y)
        g.stroke()

        // walking beam
        g.lineWidth = 30
        g.beginPath()
        g.moveTo(rear.x, rear.y)
        g.lineTo(front.x, front.y)
        g.stroke()

        // horsehead
        g.save()
        g.translate(front.x, front.y)
        g.rotate(theta)
        g.beginPath()
        g.moveTo(-40, -36)
        g.lineTo(26, -36)
        g.quadraticCurveTo(104, 40, 30, 130)
        g.lineTo(-18, 60)
        g.closePath()
        g.fill()
        g.restore()

        // bridle down to the wellhead
        const hang = { x: front.x + 64 * cos - 80 * sin, y: front.y + 64 * sin + 80 * cos }
        g.lineWidth = 5
        g.beginPath()
        g.moveTo(hang.x, hang.y)
        g.lineTo(hang.x, 850)
        g.stroke()
        g.fillRect(hang.x - 30, 850, 60, 14)
        g.fillRect(hang.x - 12, 864, 24, 34)

        g.fillStyle = P.mustard
        g.beginPath()
        g.arc(px, py, 11, 0, TAU)
        g.fill()
        g.restore()
      }

      /** Two-stroke single in cutaway: crank, rod, piston, ports, and a spark at the top. */
      function engine(g, x, a) {
        const cy = 800
        const rc = 64
        const rod = 262
        const pinY = cy - (rc * Math.cos(a) + Math.sqrt(rod ** 2 - (rc * Math.sin(a)) ** 2))
        const crankPin = { x: x + rc * Math.sin(a), y: cy - rc * Math.cos(a) }

        g.save()
        g.lineJoin = "round"
        g.lineWidth = 8
        g.strokeStyle = P.cream

        // cooling fins and barrel
        g.fillStyle = P.cream
        for (let i = 0; i < 12; i++) {
          g.fillRect(x - 196, 292 + i * 31, 56, 12)
          g.fillRect(x + 140, 292 + i * 31, 56, 12)
        }
        g.fillStyle = P.brown
        g.fillRect(x - 150, 270, 300, 410)
        g.strokeRect(x - 150, 270, 300, 410)
        g.fillStyle = P.dark
        g.fillRect(x - 100, 300, 200, 400)

        // exhaust port and pipe (right), transfer port (left)
        g.fillRect(x + 96, 468, 58, 70)
        g.fillStyle = P.brown
        g.fillRect(x + 150, 474, 200, 58)
        g.strokeRect(x + 150, 474, 200, 58)
        g.fillRect(x + 330, 452, 96, 102)
        g.strokeRect(x + 330, 452, 96, 102)
        g.fillStyle = P.dark
        g.fillRect(x - 154, 530, 58, 64)
        g.fillRect(x - 146, 590, 40, 110)

        // crankcase and flywheel
        g.fillStyle = P.brown
        g.beginPath()
        g.arc(x, cy, 158, 0, TAU)
        g.fill()
        g.stroke()
        g.save()
        g.translate(x, cy)
        g.rotate(a)
        g.fillStyle = P.orange
        g.beginPath()
        g.arc(0, 0, 112, 0, TAU)
        g.fill()
        g.fillStyle = P.rust
        g.beginPath()
        g.arc(0, 0, 112, 0.35, Math.PI - 0.35)
        g.closePath()
        g.fill()
        g.restore()
        g.fillStyle = P.cream
        g.beginPath()
        g.arc(x, cy, 16, 0, TAU)
        g.fill()

        // connecting rod
        g.strokeStyle = P.cream
        g.lineCap = "round"
        g.lineWidth = 34
        g.beginPath()
        g.moveTo(x, pinY)
        g.lineTo(crankPin.x, crankPin.y)
        g.stroke()
        g.strokeStyle = P.brown
        g.lineWidth = 20
        g.stroke()
        g.fillStyle = P.cream
        g.beginPath()
        g.arc(crankPin.x, crankPin.y, 20, 0, TAU)
        g.fill()

        // piston
        g.lineWidth = 6
        g.strokeStyle = P.cream
        g.fillStyle = P.mustard
        g.fillRect(x - 96, pinY - 72, 192, 150)
        g.strokeRect(x - 96, pinY - 72, 192, 150)
        g.fillStyle = P.dark
        g.fillRect(x - 96, pinY - 56, 192, 5)
        g.fillRect(x - 96, pinY - 42, 192, 5)
        g.fillStyle = P.cream
        g.beginPath()
        g.arc(x, pinY, 18, 0, TAU)
        g.fill()

        // head and plug
        g.fillStyle = P.brown
        g.strokeStyle = P.cream
        g.lineWidth = 8
        g.beginPath()
        round(g, x - 168, 226, 336, 56, 20)
        g.fill()
        g.stroke()
        g.fillStyle = P.cream
        g.fillRect(x - 16, 170, 32, 58)
        g.fillRect(x - 26, 196, 52, 12)
        g.fillRect(x - 4, 150, 8, 22)

        // ignition just after top dead centre
        const spark = 1 - span(((a % TAU) + TAU) % TAU, 0, 0.7)
        if (spark < 1 && spark > 0) {
          g.globalAlpha = spark
          g.fillStyle = P.mustard
          star(g, x, 312, 70 * spark + 20, 12)
          g.fillStyle = P.cream
          star(g, x, 312, 34 * spark + 10, 12)
        }
        g.restore()
      }

      // ---------- dial and transitions ----------

      function dial(g, t) {
        const a = span(t, 6.6, 6.8)
        if (!a) return
        const cx = W - 180
        const cy = 180
        const angleOf = (ch) => ((-120 + (ch - 1) * 48) * Math.PI) / 180
        let angle = angleOf(6)
        for (const [at, ch] of CLICKS) {
          angle = lerp(angle, angleOf(ch), ease.outBack(span(t, at + 0.02, at + 0.22)))
        }

        g.save()
        g.globalAlpha = a
        g.fillStyle = "rgba(29, 18, 11, 0.82)"
        g.beginPath()
        round(g, cx - 140, cy - 140, 280, 280, 36)
        g.fill()
        g.font = `700 22px ${TYPE}`
        g.textAlign = "center"
        g.textBaseline = "middle"
        g.fillStyle = P.cream
        for (let ch = 1; ch <= 6; ch++) {
          const ang = angleOf(ch)
          g.fillText(String(ch), cx + Math.sin(ang) * 108, cy - Math.cos(ang) * 108)
        }
        g.fillStyle = P.dark
        g.strokeStyle = P.cream
        g.lineWidth = 3
        g.beginPath()
        for (let i = 0; i < 48; i++) {
          const r = i % 2 ? 78 : 84
          const ang = (i / 48) * TAU + angle
          g.lineTo(cx + Math.sin(ang) * r, cy - Math.cos(ang) * r)
        }
        g.closePath()
        g.fill()
        g.stroke()
        g.fillStyle = P.mustard
        g.beginPath()
        g.arc(cx, cy, 54, 0, TAU)
        g.fill()
        g.strokeStyle = P.dark
        g.lineWidth = 12
        g.lineCap = "round"
        g.beginPath()
        g.moveTo(cx, cy)
        g.lineTo(cx + Math.sin(angle) * 62, cy - Math.cos(angle) * 62)
        g.stroke()
        g.textBaseline = "alphabetic"
        g.restore()
      }

      /** Detuned-set snow with a couple of rolling bright bands. Each field is held for two
       *  frames and drawn coarse, which still reads as snow but keeps the file small. */
      function snow(g, frame) {
        const field = frame >> 1
        g.fillStyle = "#7b7872"
        g.fillRect(0, 0, W, H)
        g.globalCompositeOperation = "overlay"
        const ox = rand(field, 1, 50) * 768
        const oy = rand(field, 2, 50) * 768
        for (let x = -ox; x < W; x += 768)
          for (let y = -oy; y < H; y += 768) g.drawImage(fine, x, y, 768, 768)
        g.globalCompositeOperation = "source-over"
        for (let i = 0; i < 3; i++) {
          const y = rand(field, i, 51) * H
          g.fillStyle = `rgba(230, 226, 214, ${0.1 + rand(field, i, 52) * 0.15})`
          g.fillRect(0, y, W, 10 + rand(field, i, 53) * 60)
        }
      }

      /** Light leak eating the frame from the right edge as the reel runs out. */
      function burn(g, t) {
        const k = span(t, 11.15, 11.7)
        if (!k) return
        g.save()
        g.globalCompositeOperation = "screen"
        const x = lerp(W + 300, W * 0.45, ease.inCubic(k))
        const r = g.createRadialGradient(x, H * 0.4, 0, x, H * 0.4, 1200)
        r.addColorStop(0, `rgba(255, 240, 200, ${k})`)
        r.addColorStop(0.4, `rgba(245, 128, 40, ${k})`)
        r.addColorStop(1, "rgba(160, 30, 10, 0)")
        g.fillStyle = r
        g.fillRect(0, 0, W, H)
        g.restore()
      }

      // ---------- film pass ----------

      function project(ctx, t, frame) {
        ctx.fillStyle = "#000"
        ctx.fillRect(0, 0, W, H)

        // gate weave, plus a vertical roll whenever the set changes channel
        const roll = rollAt(t)
        const dx = noise(frame * 0.35, 1) * 2.6
        const dy = noise(frame * 0.35, 2) * 2 - roll
        ctx.drawImage(buf, dx, dy)
        if (roll > 0) {
          ctx.drawImage(buf, dx, dy + H + 70)
          ctx.fillStyle = "#050403"
          ctx.fillRect(0, dy + H, W, 70)
        }

        // warm grade and lifted blacks
        ctx.globalCompositeOperation = "multiply"
        ctx.fillStyle = "#f6e2c2"
        ctx.fillRect(0, 0, W, H)
        ctx.globalCompositeOperation = "screen"
        ctx.fillStyle = "#1d140b"
        ctx.fillRect(0, 0, W, H)
        ctx.globalCompositeOperation = "source-over"
        ctx.fillStyle = `rgba(0, 0, 0, ${0.025 + rand(frame, 3, 60) * 0.05})`
        ctx.fillRect(0, 0, W, H)

        // grain at three times the pixel size: it reads as 16mm rather than dither, and the
        // encoder can keep it without the file ballooning
        const tile = 384 * 3
        ctx.globalCompositeOperation = "overlay"
        ctx.globalAlpha = 0.16
        const ox = rand(frame, 1, 61) * tile
        const oy = rand(frame, 2, 61) * tile
        for (let x = -ox; x < W; x += tile)
          for (let y = -oy; y < H; y += tile) ctx.drawImage(grain, x, y, tile, tile)
        ctx.globalAlpha = 1
        ctx.globalCompositeOperation = "source-over"

        dust(ctx, frame)
        scratch(ctx, t, frame)

        const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.02)
        v.addColorStop(0, "rgba(20, 10, 4, 0)")
        v.addColorStop(1, "rgba(20, 10, 4, 0.62)")
        ctx.fillStyle = v
        ctx.fillRect(0, 0, W, H)

        // rounded projector gate
        ctx.save()
        ctx.filter = "blur(5px)"
        ctx.fillStyle = "#000"
        ctx.beginPath()
        ctx.rect(-40, -40, W + 80, H + 80)
        round(ctx, 14, 12, W - 28, H - 24, 54)
        ctx.fill("evenodd")
        ctx.restore()
      }

      function rollAt(t) {
        const rolls = [
          [2.5, 0.4],
          [4.15, 0.28],
          [6.85, 0.26],
          [9.35, 0.26],
        ]
        for (const [at, len] of rolls) {
          if (within(t, at, at + len)) return (1 - ease.outCubic(span(t, at, at + len))) * (H + 70)
        }
        return 0
      }

      function dust(g, frame) {
        const n = Math.floor(rand(frame, 1, 70) * 5)
        for (let i = 0; i < n; i++) {
          const x = rand(frame, i, 71) * W
          const y = rand(frame, i, 72) * H
          const s = 2 + rand(frame, i, 73) * 6
          g.fillStyle =
            rand(frame, i, 74) < 0.7 ? "rgba(18, 10, 5, 0.75)" : "rgba(255, 246, 225, 0.7)"
          g.beginPath()
          g.ellipse(x, y, s, s * (0.5 + rand(frame, i, 75)), rand(frame, i, 76) * 3, 0, TAU)
          g.fill()
        }
        if (rand(frame, 9, 77) < 0.12) {
          const x = rand(frame, 1, 78) * W
          const y = rand(frame, 2, 78) * H
          g.strokeStyle = "rgba(18, 10, 5, 0.6)"
          g.lineWidth = 1.6
          g.beginPath()
          g.moveTo(x, y)
          g.bezierCurveTo(x + 30, y - 40, x + 60, y + 30, x + 40 + rand(frame, 3, 78) * 60, y + 70)
          g.stroke()
        }
      }

      function scratch(g, t, frame) {
        if (noise(t * 0.8, 80) < 0.35) return
        const x = 380 + (noise(t * 0.3, 81) + 1) * 600 + rand(frame, 1, 82) * 3
        g.fillStyle = `rgba(255, 246, 225, ${0.18 + rand(frame, 2, 82) * 0.2})`
        g.fillRect(x, 0, 1.6, H)
      }

      // ---------- type ----------

      /** 70s stacked drop shadow: each [colour, offset] pair drawn back to front, then the face. */
      function retro(g, str, x, y, face, shadows) {
        for (const [c, o] of shadows) {
          g.fillStyle = c
          g.fillText(str, x + o, y + o)
        }
        g.fillStyle = face
        g.fillText(str, x, y)
      }

      /** Letters drop in one after another and settle with a little bounce. */
      function dropIn(g, str, x, y, t, t0, face, shadows) {
        for (let i = 0; i < str.length; i++) {
          const k = span(t, t0 + i * 0.035, t0 + i * 0.035 + 0.45)
          if (!k) break
          const lx = x + g.measureText(str.slice(0, i)).width
          g.globalAlpha = Math.min(1, k * 3)
          retro(g, str[i], lx, y - 90 * (1 - ease.outBack(k)), face, shadows)
        }
        g.globalAlpha = 1
      }

      /** Monospaced type struck one key at a time, each slightly off its baseline. */
      function typewriter(g, str, x, y, t, t0, cps, font, color, spacing = 0) {
        g.font = font
        g.letterSpacing = `${spacing}px`
        const shown = typed(str, t, t0, cps)
        const step = g.measureText("M").width
        g.fillStyle = color
        for (let i = 0; i < shown.length; i++) {
          g.globalAlpha = 0.82 + rand(i, str.length, 90) * 0.18
          g.fillText(shown[i], x + i * step, y + (rand(i, str.length, 91) - 0.5) * 3)
        }
        g.globalAlpha = 1
        g.letterSpacing = "0px"
      }

      // ---------- helpers ----------

      function sunburst(g, x, y, color, spin) {
        g.fillStyle = color
        for (let i = 0; i < 18; i++) {
          const a = spin + (i / 18) * TAU
          g.beginPath()
          g.moveTo(x, y)
          g.arc(x, y, 2400, a, a + TAU / 36)
          g.fill()
        }
      }

      function star(g, x, y, r, points) {
        g.beginPath()
        for (let i = 0; i < points * 2; i++) {
          const rr = i % 2 ? r * 0.42 : r
          const a = (i / (points * 2)) * TAU
          g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr)
        }
        g.closePath()
        g.fill()
      }

      function round(g, x, y, w, h, r) {
        g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h)
      }

      function fill(g, [r, gr, bl], x, y, w, h) {
        g.fillStyle = `rgb(${r}, ${gr}, ${bl})`
        g.fillRect(x, y, w, h)
      }
    </script>
  </body>
